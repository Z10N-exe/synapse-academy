<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Synapse Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="font-sans antialiased text-gray-800 bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-lg">
        <div class="flex items-center justify-center mb-6">
            <i class="fas fa-brain text-4xl text-indigo-600"></i>
            <h1 class="text-2xl font-bold ml-2">Synapse Academy</h1>
        </div>
        <h2 class="text-xl font-semibold text-gray-800 mb-6 text-center">Sign Up</h2>
        <form id="signup-form">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                <select id="role" name="role" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                    <option value="student">Student</option>
                    <option value="instructor">Instructor</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition duration-300">Sign Up</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            Already have an account? <a href="login.html" class="text-indigo-600 hover:underline">Login</a>
        </p>
    </div>

    <script>
        console.log('Signup page loaded');
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            console.log('Signup form submitted');

            const email = document.getElementById('email').value.toLowerCase();
            const password = document.getElementById('password').value;
            const full_name = document.getElementById('full_name').value;
            const role = document.getElementById('role').value;

            console.log('Signup data:', { email, password, full_name, role });

            let users = JSON.parse(localStorage.getItem('users') || '[]');
            console.log('Existing users:', users);

            if (users.find(u => u.email.toLowerCase() === email)) {
                console.error('Email already registered:', email);
                alert('Email already registered.');
                return;
            }

            const newUser = { email, password, full_name, role };
            users.push(newUser);
            try {
                localStorage.setItem('users', JSON.stringify(users));
                console.log('User saved:', newUser);
                alert('Account created successfully! Please log in.');
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error saving to localStorage:', error);
                alert('Failed to create account. Check console for errors.');
            }
        });
    </script>
</body>
</html>

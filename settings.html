<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Synapse Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .dashboard-nav {
            height: calc(100vh - 4rem);
        }
        .dashboard-content {
            height: calc(100vh - 4rem);
            overflow-y: auto;
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-800">
    <nav class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-brain text-2xl"></i>
                    <span class="text-xl font-bold">Synapse Academy</span>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <button class="text-gray-300 hover:text-white">
                        <i class="fas fa-bell"></i>
                    </button>
                    <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
                </div>
                <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center">
                    <i class="fas fa-user text-indigo-600"></i>
                </div>
                <button id="mobile-menu-button" class="md:hidden text-white focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden gradient-bg px-4 pb-4">
            <a href="dashboard.html" class="block py-2 hover:text-gray-200">Dashboard</a>
            <a href="my-courses.html" class="block py-2 hover:text-gray-200">My Courses</a>
            <a href="projects.html" class="block py-2 hover:text-grid">Projects</a>
            <a href="earnings.html" class="block py-2 hover:text-gray-200">Earnings</a>
            <a href="settings.html" class="block py-2 hover:text-gray-200">Settings</a>
            <a href="recent-projects.html" class="block py-2 hover:text-gray-200">Recent Projects</a>
            <a href="saved-items.html" class="block py-2 hover:text-gray-200">Saved Items</a>
            <a href="index.html" class="block py-2 hover:text-gray-200">Logout</a>
        </div>
    </nav>

    <div class="flex">
        <div class="w-16 md:w-56 bg-gray-100 flex-shrink-0 border-r border-gray-200 dashboard-nav">
            <div class="p-4">
                <div class="space-y-4">
                    <a href="dashboard.html" class="w-full flex items-center space-x-3 p-2 rounded-lg hover:bg-gray-200 text-gray-700">
                        <i class="fas fa-home"></i>
                        <span class="hidden md:inline">Dashboard</span>
                    </a>
                    <a href="my-courses.html" class="w-full flex items-center space-x-3 p-2 rounded-lg hover:bg-gray-200 text-gray-700">
                        <i class="fas fa-book"></i>
                        <span class="hidden md:inline">My Courses</span>
                    </a>
                    <a href="projects.html" class="w-full flex items-center space-x-3 p-2 rounded-lg hover:bg-gray-200 text-gray-700">
                        <i class="fas fa-project-diagram"></i>
                        <span class="hidden md:inline">Projects</span>
                    </a>
                    <a href="earnings.html" class="w-full flex items-center space-x-3 p-2 rounded-lg hover:bg-gray-200 text-gray-700">
                        <i class="fas fa-wallet"></i>
                        <span class="hidden md:inline">Earnings</span>
                    </a>
                    <a href="settings.html" class="w-full flex items-center space-x-3 p-2 rounded-lg bg-indigo-600 text-white">
                        <i class="fas fa-cog"></i>
                        <span class="hidden md:inline">Settings</span>
                    </a>
                </div>
                <div class="mt-8 pt-4 border-t border-gray-300">
                    <h4 class="text-xs uppercase font-bold text-gray-500 mb-3 hidden md:block">Quick Access</h4>
                    <div class="space-y-2">
                        <a href="recent-projects.html" class="w-full flex items-center space-x-3 p-2 rounded-lg hover:bg-gray-200 text-gray-700">
                            <i class="fas fa-bolt text-yellow-500"></i>
                            <span class="hidden md:inline">Recent Projects</span>
                        </a>
                        <a href="saved-items.html" class="w-full flex items-center space-x-3 p-2 rounded-lg hover:bg-gray-200 text-gray-700">
                            <i class="fas fa-star text-blue-500"></i>
                            <span class="hidden md:inline">Saved Items</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 dashboard-content p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Settings</h2>
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200 card-hover">
                <h3 class="text-lg font-bold mb-4">Profile Settings</h3>
                <form id="profile-form">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="name" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="Zion" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" id="email" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="zion@example.com" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Change Password</label>
                        <input type="password" id="password" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="New password">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition duration-300">Save Changes</button>
                </form>
            </div>
            <div class="mt-8 bg-white rounded-xl shadow-sm p-6 border border-gray-200 card-hover">
                <h3 class="text-lg font-bold mb-4">Notification Preferences</h3>
                <div class="space-y-4">
                    <label class="flex items-center">
                        <input type="checkbox" class="rounded text-indigo-600" checked>
                        <span class="ml-2 text-sm text-gray-600">Email notifications for new projects</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" class="rounded text-indigo-600">
                        <span class="ml-2 text-sm text-gray-600">Push notifications for course updates</span>
                    </label>
                    <button class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition duration-300">Save Preferences</button>
                </div>
            </div>
            </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const response = await fetch('http://localhost:5000/api/user', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
            } catch (error) {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
            }

            // Handle profile form submission
            document.getElementById('profile-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch('http://localhost:5000/api/user', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: { JSON.stringify({ name, email, password ? password : null }) }
                    });
                    if (response.ok) {
                        alert('Profile updated successfully!');
                    } else {
                        alert('Failed to update profile.');
                    }
                } catch (error) {
                    alert('Error updating profile.');
                    }
                });
        });

        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>
</body>
</html>
